name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, test]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Version de test (branche test)
        if: github.ref_name == 'test'
        run: |
          sed -i 's/"appId": "com.dronestrike.game"/"appId": "com.dronestrike.game.test"/; s/"appName": "[^"]*"/"appName": "DSF Test"/' capacitor.config.json
          sed -i 's/var TEST_MODE = false;/var TEST_MODE = true;/' www/index.html
          grep -q '"com.dronestrike.game.test"' capacitor.config.json
          grep -q 'var TEST_MODE = true;' www/index.html
          cat capacitor.config.json

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icône et écran de lancement
        run: |
          cp -r resources/res/. android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp resources/splash.png {} \;

      - name: Plein écran (masquer les barres système)
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java)
          pkg=$(grep -m1 '^package' "$f")
          cat > "$f" <<EOF
          $pkg

          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setBackgroundColor(0xFF070B14);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemBars();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              private void hideSystemBars() {
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.hide(WindowInsetsCompat.Type.systemBars());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              }
          }
          EOF
          cat "$f"

      - name: Version et signature fixe (mise à jour sans désinstaller)
        run: |
          VER=$(grep -oP "APP_VERSION = '\K[0-9.]+" www/index.html)
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" $G
          cat >> $G <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file('../../debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
          grep -E "versionCode|versionName|debug.keystore" $G

      - name: Forcer le mode paysage
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Déclarer l'application comme un jeu
        run: sed -i 's/<application/<application android:appCategory="game" android:isGame="true"/' android/app/src/main/AndroidManifest.xml

      - name: Autoriser la vibration et les notifications
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
          grep -q VIBRATE android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml

      - name: Copier le jeu
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i 'SHA-256'

      - uses: actions/upload-artifact@v4
        with:
          name: drone-strike-field-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK de test (lien fixe de la branche test)
        if: github.ref_name == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "dsf-test-v$APP_VERSION.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk dsf-test.apk
          gh release delete test --yes --cleanup-tag 2>/dev/null || true
          gh release create test "dsf-test-v$APP_VERSION.apk" dsf-test.apk \
            --target "${{ github.sha }}" --prerelease --latest=false \
            --title "DSF Test V$APP_VERSION ($(TZ=Europe/Paris date '+%d/%m/%Y %H:%M'))" \
            --notes "Version de test (application séparée « DSF Test », ressources illimitées). $(git log -1 --pretty=%s)"

      - name: Publier l'APK (lien de téléchargement fixe)
        if: github.ref_name != 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "drone-strike-field-v$APP_VERSION.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk drone-strike.apk
          TAG="v$APP_VERSION"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "drone-strike-field-v$APP_VERSION.apk" drone-strike.apk \
            --target "${{ github.sha }}" --latest \
            --title "Drone Strike Field V$APP_VERSION ($(TZ=Europe/Paris date '+%d/%m/%Y %H:%M'))" \
            --notes "$(git log -1 --pretty=%B | sed '/^Co-Authored-By/d;/^Claude-Session/d')"
          # garder les 10 dernières versions
          gh release list --limit 100 --json tagName,createdAt -q '[.[] | select(.tagName != "test")] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
