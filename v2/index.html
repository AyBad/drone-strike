<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DSF V2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DSF V2">
<meta name="theme-color" content="#070b14">
<style>
  html, body { margin: 0; height: 100%; background: #070b14; overflow: hidden; touch-action: none; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  #touchUI button { position: fixed; z-index: 3; border-radius: 50%; background: rgba(79, 216, 255, 0.16); color: #cfeeff;
    border: 2px solid rgba(79, 216, 255, 0.6); padding: 0; letter-spacing: 0; }
  #dashBtn { right: 22px; top: max(30vh, 150px); width: 72px; height: 72px; font-size: 12px; }
  #pauseBtn { right: 18px; top: 92px; width: 44px; height: 44px; font-size: 15px; }
  @media (max-height: 520px) {
    .panel { padding: 16px 22px; }
    h1 { font-size: 28px; letter-spacing: 4px; }
    .sub { margin-bottom: 10px; font-size: 13px; }
    .keys { margin-bottom: 12px; gap: 4px 14px; font-size: 13px; }
    .stats { font-size: 14px; margin-bottom: 10px; line-height: 1.45; }
    button { padding: 10px 26px; font-size: 15px; }
  }
  @media (max-width: 520px) { h1 { font-size: 30px; letter-spacing: 3px; } .panel { padding: 22px 18px; } }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #e6f1ff; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; outline: none; }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 9, 18, 0.82); z-index: 5; overflow-y: auto; touch-action: pan-y;
  }
  #overlay.hidden { display: none; }
  .panel {
    width: min(560px, 90vw); padding: 32px 36px; text-align: center;
    background: #0d1626; border: 1px solid #1f3554; border-radius: 14px;
    box-shadow: 0 0 60px rgba(40, 200, 255, 0.12);
  }
  h1 { margin: 0 0 6px; font-size: 44px; letter-spacing: 6px; color: #4fd8ff; text-wrap: balance; }
  .sub { margin: 0 0 22px; color: #8fa6c4; font-size: 15px; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; text-align: left; margin: 0 auto 24px; width: fit-content; font-size: 14px; }
  .keys b { color: #ffd166; font-weight: 600; white-space: nowrap; }
  .keys span { color: #c6d4e8; }
  .stats { font-size: 17px; margin: 0 0 20px; color: #c6d4e8; line-height: 1.7; }
  .stats strong { color: #ffd166; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: 17px; font-weight: 700; letter-spacing: 2px; cursor: pointer;
    padding: 13px 38px; border-radius: 8px; border: 0; color: #04121c; background: #4fd8ff;
  }
  @media (hover: hover) and (pointer: fine) { button:hover { background: #8ae6ff; } }
  button.ghost { background: transparent; color: #4fd8ff; border: 1px solid #2a6f9c; }
  @media (hover: hover) and (pointer: fine) { button.ghost:hover { background: #12233a; } }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  h2 { margin: 0 0 14px; font-size: 26px; letter-spacing: 4px; color: #4fd8ff; }
  .aim { display: flex; gap: 8px; align-items: center; justify-content: center; margin-bottom: 14px; font-size: 14px; color: #c6d4e8; }
  .aim button, .binds button { font-size: 14px; letter-spacing: 0; padding: 7px 14px; font-weight: 600; }
  .aim button.on { background: #4fd8ff; color: #04121c; }
  .binds { display: grid; grid-template-columns: 1fr auto; gap: 7px 16px; align-items: center; text-align: left; font-size: 14px; color: #c6d4e8; max-height: 46vh; overflow-y: auto; margin-bottom: 14px; padding-right: 4px; }
  .binds button { min-width: 150px; }
  .binds button.listen { background: #ffd166; color: #04121c; border-color: #ffd166; }
  #setView .sub { font-size: 13px; margin-bottom: 16px; }
  #overlay { align-items: flex-start; }
  .panel { margin: auto; }
  .aim { flex-wrap: wrap; }
  .aim .lbl { min-width: 84px; text-align: right; color: #8fa6c4; }
  .binds { max-height: none; }
  h3 { margin: 18px 0 10px; font-size: 14px; letter-spacing: 3px; color: #8fa6c4; text-transform: uppercase; }
  #droneDesc, #nextNote, #loadout { font-size: 13px; margin: -4px 0 14px; }
  #loadout { margin: 0 0 6px; color: #c6d4e8; }
  #livesInfo { margin: 0 0 16px; font-size: 13px; color: #ff6b9d; font-variant-numeric: tabular-nums; }
  /* ---------- Paramètres ---------- */
  .panel { transition: width .2s; }
  .panel.wide { width: min(880px, 95vw); padding: 0 0 24px; text-align: left; }
  .setHead { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 18px 22px 14px;
    background: linear-gradient(#0d1626 75%, rgba(13, 22, 38, 0)); border-radius: 14px 14px 0 0; }
  .setHead h2 { margin: 0; flex: 1; text-align: center; font-size: 24px; }
  .setHead .spacer { width: 44px; }
  .iconBtn { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; letter-spacing: 0;
    background: #12233a; color: #4fd8ff; border: 1px solid #2a6f9c; }
  @media (hover: hover) and (pointer: fine) { .iconBtn:hover { background: #1a3150; } }
  .iconBtn svg { width: 22px; height: 22px; }
  .setGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 4px 22px 0; }
  .card { background: linear-gradient(160deg, #112038, #0a1324); border: 1px solid #1f3554; border-radius: 16px; padding: 16px 16px 18px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03); }
  .card.full { grid-column: 1 / -1; }
  .cardHead { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 12.5px; font-weight: 700;
    letter-spacing: 2.5px; text-transform: uppercase; color: #8fa6c4; }
  .cardHead svg { width: 20px; height: 20px; color: #4fd8ff; flex: none; }
  .langGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
  .chip { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 9px 10px; font-size: 14px; font-weight: 600; letter-spacing: 0;
    background: #0a1220; color: #c6d4e8; border: 1px solid #1f3554; border-radius: 10px; text-align: left; white-space: nowrap; }
  .chip b { font-size: 10.5px; padding: 2px 6px; border-radius: 5px; background: #1b2538; color: #8fa6c4; letter-spacing: 0.5px; }
  @media (hover: hover) and (pointer: fine) { .chip:hover { background: #12233a; } }
  .chip.on { border-color: #4fd8ff; background: rgba(79, 216, 255, 0.12); color: #ffffff; }
  .chip.on b { background: #4fd8ff; color: #04121c; }
  .toggleRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 2px; font-size: 15px; color: #e6f1ff; }
  .toggleRow + .toggleRow { border-top: 1px solid #1a2a44; }
  .toggleRow span { display: flex; align-items: center; gap: 10px; }
  .toggleRow svg { width: 20px; height: 20px; color: #8fa6c4; }
  .switch { width: 56px; height: 32px; padding: 0; border-radius: 16px; background: #1b2538; border: 1px solid #2a3a55;
    position: relative; letter-spacing: 0; flex: none; transition: background .2s, border-color .2s; }
  .switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%;
    background: #8fa6c4; transition: transform .2s, background .2s; }
  @media (hover: hover) and (pointer: fine) { .switch:hover { background: #243250; } }
  .switch.on { background: #4fd8ff; border-color: #4fd8ff; }
  @media (hover: hover) and (pointer: fine) { .switch.on:hover { background: #8ae6ff; } }
  .switch.on::after { transform: translateX(24px); background: #04121c; }
  .optGrid { display: grid; gap: 10px; }
  .diffGrid { grid-template-columns: repeat(3, 1fr); }
  .droneGrid { grid-template-columns: repeat(4, 1fr); }
  .optCard { padding: 14px 10px 12px; border-radius: 14px; background: #0a1220; border: 1px solid #1f3554; color: #c6d4e8;
    letter-spacing: 0; font-weight: 700; font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 7px;
    text-align: center; transition: transform .15s, border-color .15s, box-shadow .15s, background .15s; }
  .optCard > * { pointer-events: none; }
  @media (hover: hover) and (pointer: fine) { .optCard:hover { background: #0f1a2e; transform: translateY(-2px); } }
  .optCard.on { border-color: var(--c); background: #0f1b30; color: #ffffff;
    box-shadow: 0 0 0 1px var(--c), 0 8px 28px -10px var(--c); }
  .optCard small { font-size: 11.5px; font-weight: 500; color: #8fa6c4; line-height: 1.35; }
  .pips { display: flex; gap: 4px; }
  .pips i { width: 16px; height: 6px; border-radius: 3px; background: #1b2538; }
  .pips i.f { background: var(--c); }
  .optCard canvas { width: 86px; height: 86px; }
  .dstats { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 5px 8px; align-items: center;
    font-size: 10.5px; font-weight: 600; color: #8fa6c4; text-align: left; margin-top: 2px; }
  .bar { height: 5px; border-radius: 3px; background: #1b2538; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--c); }
  #droneDesc { text-align: center; margin: 14px 0 0; font-size: 13.5px; color: #c6d4e8; }
  #nextNote { text-align: center; margin: 8px 0 0; font-size: 12.5px; color: #ffd166; }
  .rowLine { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; color: #e6f1ff; font-size: 15px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: #0a1220; border: 1px solid #1f3554; border-radius: 10px; padding: 3px; }
  .seg button { padding: 7px 18px; font-size: 13.5px; font-weight: 600; letter-spacing: 0; background: transparent; color: #8fa6c4; border: 0; border-radius: 7px; }
  @media (hover: hover) and (pointer: fine) { .seg button:hover { background: #12233a; color: #e6f1ff; } }
  .seg button.on { background: #4fd8ff; color: #04121c; }
  #bindList.binds { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px; margin: 0; padding: 0; }
  .bindRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 8px 7px 12px;
    border-radius: 10px; background: #0a1220; border: 1px solid #16243b; font-size: 13.5px; color: #c6d4e8; }
  .binds .keycap { min-width: 70px; padding: 6px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0; color: #e6f1ff;
    background: linear-gradient(#22324d, #16233a); border: 1px solid #2e4466; border-bottom-width: 3px; border-radius: 8px; }
  @media (hover: hover) and (pointer: fine) { .binds .keycap:hover { background: linear-gradient(#2a3d5e, #1b2a45); } }
  .binds .keycap.listen { background: #ffd166; color: #04121c; border-color: #c9a043; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.25); } }
  .ctrlFoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  #setView #bindHint { margin: 0; font-size: 12px; text-align: left; flex: 1; min-width: 220px; }
  .ctrlFoot .smallBtn { padding: 8px 14px; font-size: 12px; letter-spacing: 1px; }
  @media (max-width: 700px) { .droneGrid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .diffGrid { gap: 6px; } .setGrid { padding: 4px 12px 0; } }
  @media (max-height: 520px) { .setHead { padding: 10px 16px 8px; } .setHead h2 { font-size: 20px; } .optCard canvas, .scoreCard canvas { width: 64px; height: 64px; } }
  /* ---------- Scores ---------- */
  .seg button[data-sdiff].on { background: var(--c, #4fd8ff); color: #04121c; }
  .tabsLine { display: flex; justify-content: center; margin-bottom: 16px; }
  .sumGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .tile { background: #0a1220; border: 1px solid #1f3554; border-radius: 12px; padding: 12px 14px; text-align: center; }
  .tile span { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #8fa6c4; margin-bottom: 4px; }
  .tile strong { font-size: 26px; font-weight: 800; color: #e6f1ff; font-variant-numeric: tabular-nums; }
  .tile.hl strong { color: var(--c, #ffd166); }
  .scoreCard { position: relative; padding: 14px 10px 14px; border-radius: 14px; background: #0a1220; border: 1px solid #1f3554;
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; color: #c6d4e8; }
  .scoreCard.top { border-color: var(--c); background: #0f1b30; box-shadow: 0 0 0 1px var(--c), 0 8px 28px -10px var(--c); }
  .scoreCard canvas { width: 76px; height: 76px; }
  .scoreCard .nm { font-size: 15px; font-weight: 700; color: #e6f1ff; }
  .scoreCard .big { font-size: 30px; font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; line-height: 1.15; }
  .scoreCard.empty .big { color: #3a4a63; }
  .scoreCard small { font-size: 11.5px; color: #8fa6c4; line-height: 1.35; }
  .scoreCard .badge { position: absolute; top: 8px; right: 8px; display: none; align-items: center; gap: 4px; padding: 3px 7px;
    border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; color: #04121c; background: var(--c); }
  .scoreCard.top .badge { display: inline-flex; }
  .scoreCard .badge svg { width: 12px; height: 12px; }
  .ctrlFoot .danger { border-color: #ff4d6d; color: #ff4d6d; background: rgba(255, 77, 109, 0.12); }
  @media (hover: hover) and (pointer: fine) { .ctrlFoot .danger:hover { background: rgba(255, 77, 109, 0.22); } }
  #scoreHint { margin: 0; font-size: 12px; color: #8fa6c4; text-align: left; flex: 1; min-width: 200px; }
  @media (max-width: 520px) { .tile strong { font-size: 20px; } .tile span { font-size: 9.5px; letter-spacing: 0.5px; } .scoreCard .big { font-size: 24px; } }
  /* ---------- Options de jeu ---------- */
  .mapGrid { grid-template-columns: repeat(4, 1fr); }
  .optCard canvas.mapPrev { width: 100%; height: auto; aspect-ratio: 13 / 9; border-radius: 8px; display: block; }
  #mapDesc { text-align: center; margin: 14px 0 0; font-size: 13.5px; color: #c6d4e8; }
  .playBar { display: flex; justify-content: center; padding: 18px 22px 0; }
  #optPlay { min-width: 240px; }
  @media (max-width: 700px) { .mapGrid { grid-template-columns: repeat(2, 1fr); } }
  /* ---------- Chemin, boutique, bonus ---------- */
  .comboRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
  .comboRow .chip { font-size: 13px; padding: 7px 10px; }
  .comboRow .chip b { font-variant-numeric: tabular-nums; }
  .path { padding: 10px 0 0; }
  .prow { display: flex; justify-content: space-between; position: relative; height: 96px; }
  .prow.rev { flex-direction: row-reverse; }
  .prow::before { content: ''; position: absolute; left: 10%; right: 10%; top: 25px; height: 4px; background: #1f3554; border-radius: 2px; }
  .prow + .prow::after { content: ''; position: absolute; top: -71px; height: 100px; width: 4px; background: #1f3554; border-radius: 2px; left: calc(10% - 2px); }
  .prow + .prow.rev::after { left: auto; right: calc(10% - 2px); }
  .node { width: 20%; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; z-index: 1; }
  .node small { font-size: 11.5px; font-weight: 700; color: #8fa6c4; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
  .bub { width: 54px; height: 54px; padding: 0; border-radius: 50%; font-size: 17px; font-weight: 800; letter-spacing: 0;
    display: grid; place-items: center; background: #0a1220; color: #3a4a63; border: 2px solid #1f3554; }
  .bub svg { width: 20px; height: 20px; }
  .bub.boss { border-radius: 16px; }
  .bub.done { background: var(--c); color: #04121c; border-color: var(--c); }
  @media (hover: hover) and (pointer: fine) { .bub.done:hover { filter: brightness(1.15); background: var(--c); } }
  .bub.cur { background: #0f1b30; color: #ffffff; border-color: var(--c); box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08), 0 0 22px -2px var(--c); animation: bubPulse 1.4s ease-in-out infinite; }
  @media (hover: hover) and (pointer: fine) { .bub.cur:hover { background: #16263f; } }
  .bub.lock { cursor: default; }
  @media (hover: hover) and (pointer: fine) { .bub.lock:hover { background: #0a1220; } }
  .bub.boss.lock, .bub.boss.cur { border-color: #ff3b6b; }
  @keyframes bubPulse { 50% { transform: scale(1.08); } }
  .shopGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .shopCard { padding: 16px 10px 12px; border-radius: 14px; background: #0a1220; border: 1px solid #1f3554; display: flex; flex-direction: column;
    align-items: center; gap: 6px; text-align: center; color: #c6d4e8; }
  .shopCard svg { width: 34px; height: 34px; color: var(--c); }
  .shopCard .nm { font-size: 15px; font-weight: 700; color: #e6f1ff; }
  .shopCard small { font-size: 11.5px; color: #8fa6c4; line-height: 1.35; min-height: 2.7em; }
  .shopCard .own { font-size: 12px; font-weight: 700; color: var(--c); }
  .shopCard button { margin-top: 4px; padding: 8px 12px; font-size: 13px; letter-spacing: 0.5px; width: 100%; }
  .shopCard button:disabled { background: #1b2538; color: #56667f; cursor: default; }
  .coin { color: #ffd166; }
  #itemBar { position: fixed; z-index: 3; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; }
  #itemBar button { position: relative; width: 50px; height: 50px; padding: 0; border-radius: 12px; letter-spacing: 0; display: grid; place-items: center;
    background: rgba(9, 15, 28, 0.8); border: 2px solid var(--c); color: var(--c); }
  #itemBar button svg { width: 24px; height: 24px; }
  #itemBar button b { position: absolute; right: -6px; top: -7px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; font-size: 11px; line-height: 18px;
    background: var(--c); color: #04121c; }
  #itemBar button i { position: absolute; left: 4px; bottom: 1px; font-size: 9.5px; font-style: normal; font-weight: 700; color: #8fa6c4; }
  #itemBar button.empty { opacity: 0.3; border-color: #3a4a63; color: #3a4a63; }
  #itemBar button.empty b { display: none; }
  @media (max-width: 700px) { .shopGrid { grid-template-columns: repeat(2, 1fr); } .bub { width: 46px; height: 46px; font-size: 15px; } .prow::before { top: 21px; } }
  @media (max-width: 560px) { #itemBar { bottom: 170px; } }
  /* ---------- Chemin dynamique ---------- */
  .chTabs { display: flex; justify-content: center; margin: 2px 0 14px; }
  .chTabs .seg button { display: inline-flex; align-items: center; gap: 6px; }
  .chTabs .seg button svg { width: 14px; height: 14px; }
  .chTabs .seg button:disabled { opacity: 0.45; cursor: default; background: transparent; color: #8fa6c4; }
  .chBar { height: 8px; border-radius: 4px; background: #16243b; overflow: hidden; margin: 0 0 18px; }
  .chBar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #4fd8ff, #5dff9b, #4fd8ff); background-size: 200% 100%;
    animation: flow 2.4s linear infinite; transition: width .6s ease; }
  @keyframes flow { to { background-position: -200% 0; } }
  .prow .fill { position: absolute; top: 25px; height: 4px; border-radius: 2px; left: 10%; z-index: 0;
    background: linear-gradient(90deg, #4fd8ff, #a8f0ff, #4fd8ff); background-size: 200% 100%; animation: flow 1.8s linear infinite; box-shadow: 0 0 10px rgba(79, 216, 255, 0.6); }
  .prow.rev .fill { left: auto; right: 10%; animation-direction: reverse; }
  .prow.vdone::after { background: #4fd8ff !important; box-shadow: 0 0 10px rgba(79, 216, 255, 0.6); }
  .node { animation: nodeIn .45s cubic-bezier(.2, .9, .3, 1.3) both; animation-delay: calc(var(--i) * 14ms); }
  @keyframes nodeIn { from { opacity: 0; transform: translateY(14px) scale(0.6); } }
  .bub { position: relative; transition: transform .15s; }
  @media (hover: hover) and (pointer: fine) { .bub.done:hover, .bub.cur:hover { transform: scale(1.12); } }
  .bub.cur::before, .bub.cur::after { content: ''; position: absolute; inset: -4px; border-radius: inherit; border: 2px solid var(--c); opacity: 0; animation: ring 1.8s ease-out infinite; pointer-events: none; }
  .bub.cur::after { animation-delay: .9s; }
  @keyframes ring { from { opacity: 0.8; transform: scale(1); } to { opacity: 0; transform: scale(1.9); } }
  .node small { background: #0e1a2f; padding: 0 5px; border-radius: 5px; }
  .node .go { color: var(--c, #4fd8ff); animation: bob 0.9s ease-in-out infinite; display: inline-block; }

<script>
(function () {
  'use strict';
  var APP_VERSION = '2.0.4';
  // Remplacé par true lors de la compilation de la branche « test » (application DSF Test)
  var TEST_MODE = true;
  var LS = (function () {
    var px = ''; try { if (/\/v2\//.test(location.pathname)) px = 'v2:'; } catch (err) { /* ignore */ }
    return { getItem: function (k) { return localStorage.getItem(px + k); }, setItem: function (k, v) { localStorage.setItem(px + k, v); } };
  })();
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var elTitle = document.getElementById('title');
  var elSub = document.getElementById('subtitle');
  var elStats = document.getElementById('stats');
  var elKeys = document.getElementById('keys');
  var startBtn = document.getElementById('startBtn');
  var reviveBtn = document.getElementById('reviveBtn'), nextBtn = document.getElementById('nextBtn'), pathBtn = document.getElementById('pathBtn');
  var MAX_LIVES = 5, lives = 3, bonusLives = 0, lastBonus = 0;

  var W = 0, H = 0, DPR = 1, zoom = 1, VW = 0, VH = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, typeof cfg !== 'undefined' && cfg && cfg.gfx === 'eco' ? 1 : 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    zoom = Math.max(0.5, Math.min(1, Math.min(W, H) / 640));
    VW = W / zoom; VH = H / zoom;
  }
  window.addEventListener('resize', resize);
  resize();

  var WORLD_W = 2600, WORLD_H = 1800;
  var TAU = Math.PI * 2;

  // ---------- Cartes ----------
  var MAPS = {
    plain:  { c: '#4fd8ff', ground: '#0b1322', grid: '#132038', border: '#2a6f9c' },
    city:   { c: '#c77dff', ground: '#0c1019', grid: '#161c2a', border: '#6b4fa0' },
    canyon: { c: '#ff8a3d', ground: '#15100c', grid: '#221a12', border: '#8a5a30' },
    base:   { c: '#5dff9b', ground: '#08130f', grid: '#10221a', border: '#2f7a55' }
  };
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function rectNear(x, y, w, h, cx, cy, m) {
    var qx = Math.max(x, Math.min(cx, x + w)), qy = Math.max(y, Math.min(cy, y + h));
    return Math.hypot(cx - qx, cy - qy) < m;
  }
  function buildMap(id, seed) {
    var out = [], CXm = 1300, CYm = 900, r, i, j;
    if (id === 'city') {
      r = rng(seed * 13 + 7);
      for (i = 0; i < 5; i++) for (j = 0; j < 3; j++) {
        var w = 260 + r() * 80, h = 200 + r() * 80, x = 150 + i * 500 + r() * 40, y = 160 + j * 560 + r() * 40;
        var skip = r() < 0.2;
        if (skip || rectNear(x, y, w, h, CXm, CYm, 260)) continue;
        out.push({ t: 'r', k: 'bld', x: x, y: y, w: w, h: h, s: r() });
      }
    } else if (id === 'canyon') {
      r = rng(seed * 17 + 11);
      for (var tries = 0; tries < 900 && out.length < 24; tries++) {
        var rad = 45 + r() * 65, cx = rad + 60 + r() * (2600 - 2 * (rad + 60)), cy = rad + 60 + r() * (1800 - 2 * (rad + 60)), ok = true;
        if (Math.hypot(cx - CXm, cy - CYm) < rad + 300) continue;
        for (j = 0; j < out.length; j++) if (Math.hypot(cx - out[j].x, cy - out[j].y) < rad + out[j].r + 110) { ok = false; break; }
        if (!ok) continue;
        var v = [];
        for (j = 0; j < 9; j++) v.push(0.84 + r() * 0.16);
        out.push({ t: 'c', x: cx, y: cy, r: rad, v: v, a: r() * 6.28 });
      }
    } else if (id === 'base') {
      r = rng(seed * 19 + 5);
      var T = 32;
      for (i = 0; i < 5; i++) for (j = 0; j < 4; j++) {
        var bx = 260 + i * 520, by = 225 + j * 450;
        if (Math.hypot(bx - CXm, by - CYm) < 330) continue;
        var kind = Math.floor(r() * 3);
        if (kind === 0) out.push({ t: 'r', k: 'wall', x: bx - 150, y: by - T / 2, w: 300, h: T });
        else if (kind === 1) out.push({ t: 'r', k: 'wall', x: bx - T / 2, y: by - 130, w: T, h: 260 });
        else {
          var sx = r() < 0.5 ? -1 : 1, sy = r() < 0.5 ? -1 : 1;
          out.push({ t: 'r', k: 'wall', x: sx < 0 ? bx - 220 : bx, y: by - T / 2, w: 220, h: T });
          out.push({ t: 'r', k: 'wall', x: bx - T / 2, y: sy < 0 ? by - 200 : by, w: T, h: 200 });
        }
      }
    }
    return out;
  }
  var PALS = [
    { c: '#4fd8ff', ground: '#0b1322', grid: '#132038', border: '#2a6f9c' },
    { c: '#c77dff', ground: '#0e0c19', grid: '#1b1730', border: '#6b4fa0' },
    { c: '#ff8a3d', ground: '#15100c', grid: '#221a12', border: '#8a5a30' },
    { c: '#5dff9b', ground: '#08130f', grid: '#10221a', border: '#2f7a55' },
    { c: '#ffd166', ground: '#141208', grid: '#221f10', border: '#8a7430' },
    { c: '#ff6b9d', ground: '#160b12', grid: '#26131f', border: '#8a3058' },
    { c: '#6fa8ff', ground: '#090f1c', grid: '#121c33', border: '#3559a0' },
    { c: '#7df0e0', ground: '#07131a', grid: '#0f2330', border: '#2a7a8a' },
    { c: '#e8ecf5', ground: '#101216', grid: '#1b1e25', border: '#5a6272' }
  ];
  var MTYPES = ['city', 'canyon', 'base', 'mixed', 'pillars'];
  function mapInfo(n) {
    if (n <= 1) return { type: 'plain', pal: PALS[0] };
    var r = rng(n * 7919 + 13);
    return { type: MTYPES[(n - 2 + Math.floor((n - 2) / 5)) % 5], pal: PALS[(n * 4 + Math.floor(r() * 3)) % PALS.length] };
  }
  function genMap(n) {
    var type = mapInfo(n).type, out = [], CXm = 1300, CYm = 900, r = rng(n * 104729 + 71), i, j, k;
    function rock(cx, cy, rad, pil) {
      var v = [];
      for (var q = 0; q < 9; q++) v.push(pil ? 0.97 + r() * 0.03 : 0.82 + r() * 0.18);
      out.push({ t: 'c', k: pil ? 'pil' : 'rock', x: cx, y: cy, r: rad, v: v, a: r() * 6.28 });
    }
    function clearOf(cx, cy, rad, gap) {
      if (Math.hypot(cx - CXm, cy - CYm) < rad + 300) return false;
      for (var q = 0; q < out.length; q++) {
        var o = out[q];
        if (o.t === 'r' ? rectNear(o.x, o.y, o.w, o.h, cx, cy, rad + gap) : Math.hypot(cx - o.x, cy - o.y) < rad + o.r + gap) return false;
      }
      return true;
    }
    function rocks(count, rmin, rspan) {
      for (var tries = 0, made = 0; tries < 1200 && made < count; tries++) {
        var rad = rmin + r() * rspan, cx = rad + 60 + r() * (2600 - 2 * (rad + 60)), cy = rad + 60 + r() * (1800 - 2 * (rad + 60));
        if (!clearOf(cx, cy, rad, 115)) continue;
        rock(cx, cy, rad, false); made++;
      }
    }
    function walls(cols, rows, pSkip, T) {
      var cw = 2600 / cols, ch = 1800 / rows;
      for (i = 0; i < cols; i++) for (j = 0; j < rows; j++) {
        var bx = cw * (i + 0.5) + (r() - 0.5) * cw * 0.2, by = ch * (j + 0.5) + (r() - 0.5) * ch * 0.2, kind = Math.floor(r() * 4), skip = r() < pSkip;
        var L = Math.min(cw - 190, 200 + r() * 150), Lv = Math.min(ch - 190, 180 + r() * 130);
        if (skip || Math.hypot(bx - CXm, by - CYm) < 350) continue;
        if (kind === 0) out.push({ t: 'r', k: 'wall', x: bx - L / 2, y: by - T / 2, w: L, h: T });
        else if (kind === 1) out.push({ t: 'r', k: 'wall', x: bx - T / 2, y: by - Lv / 2, w: T, h: Lv });
        else if (kind === 2) {
          var sx = r() < 0.5 ? -1 : 1, sy = r() < 0.5 ? -1 : 1;
          out.push({ t: 'r', k: 'wall', x: sx < 0 ? bx - L * 0.7 : bx, y: by - T / 2, w: L * 0.7, h: T });
          out.push({ t: 'r', k: 'wall', x: bx - T / 2, y: sy < 0 ? by - Lv * 0.75 : by, w: T, h: Lv * 0.75 });
        } else {
          out.push({ t: 'r', k: 'wall', x: bx - L / 2, y: by - T / 2, w: L, h: T });
          out.push({ t: 'r', k: 'wall', x: bx - T / 2, y: by - Lv / 2, w: T, h: Lv });
        }
      }

    secPre: ["Les secteurs seront disputés dès la saison 1.", "Sectors will be fought over from season 1.", "Los sectores se disputarán desde la temporada 1.", "I settori saranno contesi dalla stagione 1.", "区域争夺将从第1赛季开始。", "Битва за секторы начнётся с 1-го сезона.", "ستبدأ المنافسة على القطاعات من الموسم 1.", "رقابت بر سر مناطق از فصل ۱ آغاز می‌شود.", "セクター争奪はシーズン1から。", "구역 쟁탈전은 시즌 1부터 시작됩니다.", "Os setores serão disputados a partir da temporada 1.", "Ab Saison 1 wird um die Sektoren gekämpft.", "Bölgeler 1. sezondan itibaren çekişmeli olacak.", "Sektor diperebutkan mulai musim 1.", "क्षेत्रों के लिए लड़ाई सीज़न 1 से शुरू होगी।"],
    secReward2: ["L’alliance qui tient ce secteur en fin de saison gagne son revêtement exclusif et des diamants.", "The alliance holding this sector at season’s end wins its exclusive wrap and diamonds.", "La alianza que controle este sector al final de la temporada gana su revestimiento exclusivo y diamantes.", "L’alleanza che controlla questo settore a fine stagione vince la sua livrea esclusiva e diamanti.", "赛季结束时占领该区域的联盟将获得专属涂装和钻石。", "Альянс, удерживающий этот сектор в конце сезона, получает его эксклюзивное покрытие и алмазы.", "التحالف المسيطر على هذا القطاع في نهاية الموسم يربح طلاءه الحصري والماس.", "اتحادی که این منطقه را در پایان فصل در دست دارد پوشش ویژه آن و الماس می‌برد.", "シーズン終了時にこのセクターを支配する同盟が限定ラッピングとダイヤを獲得。", "시즌 종료 시 이 구역을 지킨 동맹이 전용 래핑과 다이아몬드를 얻습니다.", "A aliança que controlar este setor no fim da temporada ganha seu revestimento exclusivo e diamantes.", "Die Allianz, die diesen Sektor am Saisonende hält, gewinnt dessen exklusive Folierung und Diamanten.", "Sezon sonunda bu bölgeyi elinde tutan ittifak özel kaplamasını ve elmas kazanır.", "Aliansi yang menguasai sektor ini di akhir musim memenangkan pembungkus eksklusif dan berlian.", "सीज़न के अंत में इस क्षेत्र पर क़ाबिज़ गठबंधन इसका ख़ास रैप और हीरे जीतता है।"],

    n1t: ["Bienvenue sur le Front", "Welcome to the Front", "Bienvenido al Frente", "Benvenuto al Fronte", "欢迎来到前线", "Добро пожаловать на Фронт", "مرحبًا بك في الجبهة", "به جبهه خوش آمدی", "前線へようこそ", "전선에 오신 것을 환영합니다", "Bem-vindo à Frente", "Willkommen an der Front", "Cepheye hoş geldin", "Selamat datang di Garis Depan", "मोर्चे पर स्वागत है"],
    n1d: ["Le jeu en ligne commence par une présaison : apprends le jeu, prépare ton drone et forme ton alliance. Ensuite, les saisons commencent.", "Online play starts with a pre-season: learn the game, prepare your drone and build your alliance. Then the seasons begin.", "El juego en línea empieza con una pretemporada: aprende, prepara tu dron y forma tu alianza. Después empiezan las temporadas.", "Il gioco online inizia con una pre-stagione: impara, prepara il drone e forma la tua alleanza. Poi iniziano le stagioni.", "在线模式从季前赛开始：熟悉玩法、准备无人机、组建联盟。之后正式赛季开启。", "Онлайн-игра начинается с предсезона: изучи игру, подготовь дрон и собери альянс. Затем начнутся сезоны.", "يبدأ اللعب عبر الإنترنت بفترة ما قبل الموسم: تعلّم اللعبة وجهّز طائرتك وكوّن تحالفك. ثم تبدأ المواسم.", "بازی آنلاین با پیش‌فصل شروع می‌شود: بازی را یاد بگیر، پهپادت را آماده کن و اتحادت را بساز. سپس فصل‌ها آغاز می‌شوند.", "オンラインはプレシーズンから：ゲームを覚え、ドローンを準備し、同盟を作ろう。その後シーズンが始まります。", "온라인은 프리시즌으로 시작합니다: 게임을 익히고 드론을 준비하고 동맹을 만드세요. 그다음 시즌이 시작됩니다.", "O jogo online começa com uma pré-temporada: aprenda, prepare seu drone e forme sua aliança. Depois começam as temporadas.", "Online beginnt mit einer Vorsaison: Lerne das Spiel, bereite deine Drohne vor und gründe deine Allianz. Danach starten die Saisons.", "Çevrimiçi oyun sezon öncesiyle başlar: oyunu öğren, dronunu hazırla, ittifakını kur. Ardından sezonlar başlar.", "Mode online dimulai dengan pramusim: pelajari game, siapkan drone, dan bentuk aliansimu. Lalu musim dimulai.", "ऑनलाइन खेल प्री-सीज़न से शुरू होता है: खेल सीखें, ड्रोन तैयार करें और गठबंधन बनाएँ। फिर सीज़न शुरू होते हैं।"],
    n1a: ["Présaison : idéale pour s’entraîner sans pression.", "Pre-season: perfect to practise without pressure.", "Pretemporada: ideal para entrenar sin presión.", "Pre-stagione: ideale per allenarsi senza pressione.", "季前赛：轻松练习的最佳时机。", "Предсезон: тренируйся без давления.", "ما قبل الموسم: مثالية للتدرب دون ضغط.", "پیش‌فصل: مناسب برای تمرین بدون فشار.", "プレシーズン：気軽に練習できる期間。", "프리시즌: 부담 없이 연습하기 좋습니다.", "Pré-temporada: ideal para treinar sem pressão.", "Vorsaison: ideal zum Üben ohne Druck.", "Sezon öncesi: baskısız antrenman için ideal.", "Pramusim: cocok untuk berlatih tanpa tekanan.", "प्री-सीज़न: बिना दबाव अभ्यास के लिए बढ़िया।"],
    n1b: ["Saison : les alliances se disputent les secteurs du Front.", "Season: alliances fight over the Front’s sectors.", "Temporada: las alianzas se disputan los sectores.", "Stagione: le alleanze si contendono i settori.", "赛季：各联盟争夺前线区域。", "Сезон: альянсы сражаются за секторы Фронта.", "الموسم: تتنافس التحالفات على قطاعات الجبهة.", "فصل: اتحادها بر سر مناطق جبهه می‌جنگند.", "シーズン：同盟同士で前線のセクターを奪い合う。", "시즌: 동맹들이 전선의 구역을 두고 싸웁니다.", "Temporada: as alianças disputam os setores da Frente.", "Saison: Allianzen kämpfen um die Sektoren der Front.", "Sezon: ittifaklar cephe bölgeleri için savaşır.", "Musim: aliansi memperebutkan sektor Garis Depan.", "सीज़न: गठबंधन मोर्चे के क्षेत्रों के लिए लड़ते हैं।"],
    n2d: ["Plusieurs alliances s’affrontent sur le serveur. Rejoins-en une ou crée la tienne avec son nom, son sigle et son emblème.", "Several alliances compete on the server. Join one or create yours with its own name, tag and emblem.", "Varias alianzas compiten en el servidor. Únete a una o crea la tuya con su nombre, siglas y emblema.", "Più alleanze si sfidano sul server. Unisciti a una o crea la tua con nome, sigla ed emblema.", "服务器上有多个联盟相互竞争。加入一个，或用自己的名称、标签和徽章创建联盟。", "На сервере соперничают несколько альянсов. Вступи в один или создай свой с названием, тегом и эмблемой.", "تتنافس عدة تحالفات على الخادم. انضم إلى أحدها أو أنشئ تحالفك باسمه ورمزه وشعاره.", "چند اتحاد در سرور رقابت می‌کنند. به یکی بپیوند یا اتحاد خودت را با نام، نشان اختصاری و نشان بساز.", "サーバーでは複数の同盟が競います。参加するか、名前・タグ・紋章を決めて自分の同盟を作ろう。", "서버에서는 여러 동맹이 경쟁합니다. 하나에 가입하거나 이름, 태그, 엠블럼으로 직접 만드세요.", "Várias alianças disputam o servidor. Entre numa ou crie a sua com nome, sigla e emblema.", "Mehrere Allianzen treten auf dem Server an. Tritt einer bei oder gründe deine eigene mit Name, Kürzel und Wappen.", "Sunucuda birçok ittifak yarışır. Birine katıl ya da adı, kısaltması ve amblemiyle kendininkini kur.", "Beberapa aliansi bersaing di server. Gabung salah satu atau buat milikmu dengan nama, tag, dan lambang.", "सर्वर पर कई गठबंधन मुकाबला करते हैं। किसी से जुड़ें या नाम, टैग और प्रतीक के साथ अपना बनाएँ।"],
    n2a: ["Tu peux quitter ton alliance et en rejoindre une autre.", "You can leave your alliance and join another.", "Puedes dejar tu alianza y unirte a otra.", "Puoi lasciare l’alleanza e unirti a un’altra.", "你可以退出联盟并加入其他联盟。", "Можно покинуть альянс и вступить в другой.", "يمكنك مغادرة تحالفك والانضمام إلى آخر.", "می‌توانی اتحادت را ترک کنی و به دیگری بپیوندی.", "同盟を抜けて別の同盟に入ることもできます。", "동맹을 탈퇴하고 다른 동맹에 가입할 수 있습니다.", "Você pode sair da aliança e entrar em outra.", "Du kannst deine Allianz verlassen und einer anderen beitreten.", "İttifakından ayrılıp başka birine katılabilirsin.", "Kamu bisa keluar dan bergabung dengan aliansi lain.", "आप गठबंधन छोड़कर दूसरे से जुड़ सकते हैं।"],
    n2b: ["Le classement des alliances se trouve dans le bouton Alliance.", "The alliance ranking is in the Alliance button.", "La clasificación de alianzas está en el botón Alianza.", "La classifica delle alleanze è nel pulsante Alleanza.", "联盟排行在“联盟”按钮中。", "Рейтинг альянсов — в кнопке «Альянс».", "ترتيب التحالفات موجود في زر التحالف.", "رده‌بندی اتحادها در دکمه اتحاد است.", "同盟ランキングは「同盟」ボタンにあります。", "동맹 순위는 동맹 버튼에 있습니다.", "A classificação das alianças fica no botão Aliança.", "Die Allianz-Rangliste findest du unter „Allianz“.", "İttifak sıralaması İttifak düğmesinde.", "Peringkat aliansi ada di tombol Aliansi.", "गठबंधन रैंकिंग गठबंधन बटन में है।"],
    n3t: ["Ton tableau de bord", "Your dashboard", "Tu panel", "Il tuo pannello", "你的控制台", "Твоя панель", "لوحة قيادتك", "داشبورد تو", "あなたのダッシュボード", "나의 대시보드", "Seu painel", "Deine Übersicht", "Kontrol panelin", "Dasbormu", "आपका डैशबोर्ड"],
    n3d: ["Ton QG : ton alliance, les modes de combat et la carte des secteurs du Front.", "Your HQ: your alliance, battle modes and the map of the Front’s sectors.", "Tu cuartel: tu alianza, los modos de combate y el mapa de sectores.", "Il tuo QG: alleanza, modalità di combattimento e mappa dei settori.", "你的总部：联盟、战斗模式和前线区域地图。", "Твой штаб: альянс, режимы боя и карта секторов Фронта.", "مقرك: تحالفك وأنماط القتال وخريطة قطاعات الجبهة.", "مقر تو: اتحادت، حالت‌های نبرد و نقشه مناطق جبهه.", "拠点：同盟、バトルモード、前線のセクターマップ。", "본부: 동맹, 전투 모드, 전선 구역 지도.", "Seu QG: sua aliança, os modos de combate e o mapa dos setores.", "Dein HQ: deine Allianz, die Kampfmodi und die Sektorkarte der Front.", "Karargâhın: ittifakın, savaş modları ve cephe haritası.", "Markasmu: aliansi, mode tempur, dan peta sektor.", "आपका मुख्यालय: गठबंधन, युद्ध मोड और मोर्चे का नक्शा।"],
    n3b: ["Défi fantôme et classement arrivent bientôt.", "Ghost challenge and leaderboard are coming soon.", "El desafío fantasma y la clasificación llegan pronto.", "Sfida fantasma e classifica in arrivo.", "幽灵挑战和排行榜即将推出。", "Вызов призрака и рейтинг скоро появятся.", "تحدي الشبح والترتيب قريبًا.", "چالش شبح و رده‌بندی به‌زودی می‌آیند.", "ゴースト対戦とランキングは近日公開。", "고스트 대결과 순위표가 곧 추가됩니다.", "Desafio fantasma e classificação em breve.", "Geister-Duell und Rangliste kommen bald.", "Hayalet düellosu ve sıralama yakında.", "Tantangan hantu dan peringkat segera hadir.", "घोस्ट चुनौती और लीडरबोर्ड जल्द आ रहे हैं।"],
    n4t: ["Deux chats", "Two chats", "Dos chats", "Due chat", "两个聊天频道", "Два чата", "دردشتان", "دو گفتگو", "2つのチャット", "두 개의 채팅", "Dois chats", "Zwei Chats", "İki sohbet", "Dua obrolan", "दो चैट"],
    n4d: ["Le chat d’alliance pour organiser vos attaques, le chat serveur pour parler avec tous les pilotes.", "Alliance chat to plan your attacks, server chat to talk with every pilot.", "Chat de alianza para organizar ataques, chat del servidor para hablar con todos.", "Chat d’alleanza per organizzare gli attacchi, chat del server per parlare con tutti.", "联盟聊天用于策划进攻，服务器聊天与所有飞行员交流。", "Чат альянса — для планирования атак, чат сервера — для общения со всеми.", "دردشة التحالف لتنظيم الهجمات، ودردشة الخادم للتحدث مع جميع الطيارين.", "گفتگوی اتحاد برای برنامه‌ریزی حمله و گفتگوی سرور برای صحبت با همه خلبانان.", "同盟チャットで作戦会議、サーバーチャットで全員と交流。", "동맹 채팅으로 공격을 계획하고, 서버 채팅으로 모든 파일럿과 대화하세요.", "Chat da aliança para planejar ataques, chat do servidor para falar com todos.", "Allianz-Chat für eure Angriffe, Server-Chat für alle Piloten.", "Saldırıları planlamak için ittifak sohbeti, herkesle konuşmak için sunucu sohbeti.", "Obrolan aliansi untuk merencanakan serangan, obrolan server untuk semua pilot.", "हमलों की योजना के लिए गठबंधन चैट, सभी पायलटों से बात के लिए सर्वर चैट।"],
    n4a: ["Reste respectueux : le chat serveur est vu par tous.", "Be respectful: everyone sees the server chat.", "Sé respetuoso: todos ven el chat del servidor.", "Sii rispettoso: tutti vedono la chat del server.", "请文明交流：服务器聊天所有人可见。", "Будь вежлив: чат сервера видят все.", "كن محترمًا: الجميع يرى دردشة الخادم.", "محترم باش: همه گفتگوی سرور را می‌بینند.", "マナーを守ろう：サーバーチャットは全員が見ます。", "예의를 지키세요: 서버 채팅은 모두가 봅니다.", "Seja respeitoso: todos veem o chat do servidor.", "Bleib respektvoll: Alle sehen den Server-Chat.", "Saygılı ol: sunucu sohbetini herkes görür.", "Tetap sopan: semua orang melihat obrolan server.", "सम्मान बनाए रखें: सर्वर चैट सब देखते हैं।"],
    n5d: ["Le bouton Drone ouvre ton hangar : améliore-le avec des roues dentées achetées en diamants.", "The Drone button opens your hangar: upgrade it with gears bought with diamonds.", "El botón Dron abre tu hangar: mejóralo con engranajes comprados con diamantes.", "Il pulsante Drone apre l’hangar: potenzialo con ingranaggi comprati con diamanti.", "“无人机”按钮打开机库：用钻石购买的齿轮升级。", "Кнопка «Дрон» открывает ангар: улучшай шестерёнками за алмазы.", "زر الطائرة يفتح حظيرتك: طوّرها بتروس تشتريها بالماس.", "دکمه پهپاد آشیانه‌ات را باز می‌کند: با چرخ‌دنده‌هایی که با الماس می‌خری ارتقایش بده.", "ドローンボタンで格納庫へ：ダイヤで買ったギアで強化。", "드론 버튼으로 격납고를 열고 다이아몬드로 산 톱니바퀴로 강화하세요.", "O botão Drone abre seu hangar: melhore-o com engrenagens compradas com diamantes.", "Der Drohnen-Button öffnet deinen Hangar: Verbessere sie mit Zahnrädern für Diamanten.", "Dron düğmesi hangarını açar: elmasla alınan dişlilerle geliştir.", "Tombol Drone membuka hangar: tingkatkan dengan roda gigi yang dibeli dengan berlian.", "ड्रोन बटन आपका हैंगर खोलता है: हीरों से ख़रीदे गियर से अपग्रेड करें।"],

    g1d: ["Faucons ou Spectres : tu combats pour ce camp pendant toute la saison.", "Hawks or Specters: you fight for this side all season long.", "Halcones o Espectros: luchas por este bando toda la temporada.", "Falchi o Spettri: combatti per questa fazione per tutta la stagione.", "猎鹰或幽灵：整个赛季你都为该阵营而战。", "Соколы или Призраки: ты сражаешься за эту сторону весь сезон.", "الصقور أو الأشباح: تقاتل لهذا المعسكر طوال الموسم.", "شاهین‌ها یا شبح‌ها: در تمام فصل برای این جناح می‌جنگی.", "ホークかスペクター：シーズン中はその陣営のために戦います。", "호크 또는 스펙터: 시즌 내내 그 진영을 위해 싸웁니다.", "Falcões ou Espectros: você luta por esse lado a temporada toda.", "Falken oder Gespenster: Du kämpfst die ganze Saison für diese Seite.", "Şahinler mi Hayaletler mi: tüm sezon bu taraf için savaşırsın.", "Elang atau Bayangan: kamu bertarung untuk pihak ini sepanjang musim.", "बाज़ या प्रेत: पूरे सीज़न आप इसी पक्ष के लिए लड़ते हैं।"],

    g2d: ["Au hangar, améliore-le avec des roues dentées achetées en diamants. Les diamants se gagnent gratuitement en battant les colosses hors ligne.", "In the hangar, upgrade it with gears bought with diamonds. Earn diamonds for free by beating colossi offline.", "En el hangar, mejóralo con engranajes comprados con diamantes. Gana diamantes gratis venciendo colosos sin conexión.", "Nell'hangar, potenzialo con ingranaggi comprati con diamanti. Guadagni diamanti gratis battendo i colossi offline.", "在机库用钻石购买的齿轮升级它。离线击败巨像即可免费获得钻石。", "В ангаре улучшай его шестерёнками, купленными за алмазы. Алмазы даются бесплатно за победы над колоссами офлайн.", "في الحظيرة، طوّرها بتروس تشتريها بالماس. اربح الماس مجانًا بهزيمة العمالقة دون اتصال.", "در آشیانه آن را با چرخ‌دنده‌هایی که با الماس می‌خری ارتقا بده. الماس را رایگان با شکست غول‌ها در حالت آفلاین به دست می‌آوری.", "格納庫でダイヤで買ったギアを使って強化。ダイヤはオフラインで巨像を倒すと無料でもらえます。", "격납고에서 다이아몬드로 산 톱니바퀴로 강화하세요. 다이아몬드는 오프라인에서 거신을 물리치면 무료로 얻습니다.", "No hangar, melhore-o com engrenagens compradas com diamantes. Ganhe diamantes grátis vencendo colossos offline.", "Verbessere sie im Hangar mit Zahnrädern, die du mit Diamanten kaufst. Diamanten gibt es gratis für besiegte Kolosse im Offline-Modus.", "Hangarda elmasla alınan dişlilerle geliştir. Elmasları çevrimdışı devleri yenerek ücretsiz kazanırsın.", "Di hangar, tingkatkan dengan roda gigi yang dibeli dengan berlian. Dapatkan berlian gratis dengan mengalahkan raksasa offline.", "हैंगर में हीरों से ख़रीदे गियर से इसे अपग्रेड करें। ऑफ़लाइन विशालकायों को हराकर हीरे मुफ़्त मिलते हैं।"],

    g3d: ["Défi fantôme, duel 1 contre 1, raid contre un colosse avec d'autres pilotes, bataille de secteur en équipe.", "Ghost challenge, 1v1 duel, raid against a colossus with other pilots, team sector battle.", "Desafío fantasma, duelo 1 contra 1, incursión contra un coloso con otros pilotos, batalla de sector en equipo.", "Sfida fantasma, duello 1 contro 1, raid contro un colosso con altri piloti, battaglia di settore a squadre.", "幽灵挑战、1对1决斗、与其他飞行员合力突袭巨像、团队区域争夺战。", "Вызов призрака, дуэль 1 на 1, рейд на колосса с другими пилотами, командная битва за сектор.", "تحدي الشبح، مبارزة فردية، غارة ضد عملاق مع طيارين آخرين، معركة قطاع جماعية.", "چالش شبح، دوئل یک‌به‌یک، یورش به غول با خلبانان دیگر، نبرد تیمی برای منطقه.", "ゴースト対戦、1対1の決闘、仲間と巨像に挑むレイド、チームでのセクター戦。", "고스트 대결, 1대1 결투, 다른 파일럿과 함께하는 거신 레이드, 팀 구역 전투.", "Desafio fantasma, duelo 1 contra 1, ataque a um colosso com outros pilotos, batalha de setor em equipe.", "Geister-Duell, 1-gegen-1-Duell, Raid gegen einen Koloss mit anderen Piloten, Sektorschlacht im Team.", "Hayalet düellosu, bire bir düello, diğer pilotlarla deve baskın, takım hâlinde bölge savaşı.", "Tantangan hantu, duel 1 lawan 1, serbuan raksasa bersama pilot lain, pertempuran sektor beregu.", "घोस्ट चुनौती, 1 बनाम 1 द्वंद्व, दूसरे पायलटों के साथ विशालकाय पर धावा, टीम क्षेत्र युद्ध।"],
    g4t: ["Monte en rang", "Rank up", "Sube de rango", "Sali di grado", "提升段位", "Повышай ранг", "ارتقِ في الرتبة", "رتبه‌ات را بالا ببر", "ランクを上げる", "랭크 올리기", "Suba de patente", "Steige im Rang auf", "Rütbe atla", "Naik peringkat", "रैंक बढ़ाएँ"],
    g4d: ["Chaque victoire rapporte des points de rang : Recrue, As, puis Légende. Le classement repart à chaque saison.", "Every win earns rank points: Recruit, Ace, then Legend. The leaderboard resets each season.", "Cada victoria da puntos de rango: Recluta, As y luego Leyenda. La clasificación se reinicia cada temporada.", "Ogni vittoria dà punti grado: Recluta, Asso, poi Leggenda. La classifica riparte a ogni stagione.", "每场胜利都获得段位分：新兵、王牌，然后是传奇。排行榜每个赛季重置。", "Каждая победа даёт очки ранга: Новобранец, Ас, затем Легенда. Рейтинг обнуляется каждый сезон.", "كل انتصار يمنحك نقاط رتبة: مجنّد، ثم آس، ثم أسطورة. يُعاد الترتيب كل موسم.", "هر پیروزی امتیاز رتبه می‌دهد: تازه‌کار، آس، سپس افسانه. رده‌بندی هر فصل از نو شروع می‌شود.", "勝利ごとにランクポイント獲得：新兵、エース、そしてレジェンド。ランキングは毎シーズンリセット。", "승리할 때마다 랭크 점수 획득: 신병, 에이스, 그리고 전설. 순위표는 시즌마다 초기화됩니다.", "Cada vitória dá pontos de patente: Recruta, Ás e depois Lenda. A classificação recomeça a cada temporada.", "Jeder Sieg bringt Rangpunkte: Rekrut, Ass, dann Legende. Die Rangliste startet jede Saison neu.", "Her zafer rütbe puanı kazandırır: Acemi, As, sonra Efsane. Sıralama her sezon sıfırlanır.", "Setiap kemenangan memberi poin peringkat: Rekrut, Jagoan, lalu Legenda. Peringkat diatur ulang tiap musim.", "हर जीत से रैंक अंक मिलते हैं: रंगरूट, इक्का, फिर लीजेंड। लीडरबोर्ड हर सीज़न फिर से शुरू होता है।"],
    g5t: ["Conquiers le Front", "Conquer the Front", "Conquista el Frente", "Conquista il Fronte", "征服前线", "Захвати Фронт", "اغزُ الجبهة", "جبهه را فتح کن", "前線を制圧", "전선 정복", "Conquiste a Frente", "Erobere die Front", "Cepheyi fethet", "Kuasai Garis Depan", "मोर्चा जीतें"],
    g5d: ["Tes victoires font gagner des secteurs à ton camp. En fin de saison, le camp qui tient un secteur reçoit son revêtement exclusif et des diamants.", "Your wins capture sectors for your side. At season's end, the side holding a sector gets its exclusive wrap and diamonds.", "Tus victorias conquistan sectores para tu bando. Al final de la temporada, el bando que controla un sector recibe su revestimiento exclusivo y diamantes.", "Le tue vittorie conquistano settori per la tua fazione. A fine stagione, chi controlla un settore riceve la sua livrea esclusiva e diamanti.", "你的胜利为阵营夺取区域。赛季结束时，占领区域的阵营获得专属涂装和钻石。", "Твои победы захватывают секторы для твоей стороны. В конце сезона сторона, удерживающая сектор, получает его эксклюзивное покрытие и алмазы.", "انتصاراتك تكسب قطاعات لمعسكرك. في نهاية الموسم، يحصل المعسكر المسيطر على قطاع على طلائه الحصري وعلى الماس.", "پیروزی‌هایت برای جناحت منطقه می‌گیرد. در پایان فصل، جناحی که منطقه‌ای را در دست دارد پوشش ویژه آن و الماس می‌گیرد.", "勝利で陣営のセクターを獲得。シーズン終了時、セクターを支配する陣営は限定ラッピングとダイヤを獲得します。", "승리하면 진영이 구역을 차지합니다. 시즌 종료 시 구역을 지킨 진영은 전용 래핑과 다이아몬드를 받습니다.", "Suas vitórias conquistam setores para seu lado. No fim da temporada, o lado que controla um setor recebe seu revestimento exclusivo e diamantes.", "Deine Siege erobern Sektoren für deine Seite. Am Saisonende erhält die Seite, die einen Sektor hält, dessen exklusive Folierung und Diamanten.", "Zaferlerin tarafına bölge kazandırır. Sezon sonunda bir bölgeyi elinde tutan taraf, o bölgenin özel kaplamasını ve elmas kazanır.", "Kemenanganmu merebut sektor untuk pihakmu. Di akhir musim, pihak yang menguasai sektor mendapat pembungkus eksklusif dan berlian.", "आपकी जीत आपके पक्ष के लिए क्षेत्र जीतती है। सीज़न के अंत में किसी क्षेत्र पर क़ाबिज़ पक्ष को उसका ख़ास रैप और हीरे मिलते हैं।"],

    secReward: ["Le camp qui tient ce secteur en fin de saison gagne son revêtement exclusif et des diamants.", "The side holding this sector at season's end wins its exclusive wrap and diamonds.", "El bando que controle este sector al final de la temporada gana su revestimiento exclusivo y diamantes.", "La fazione che controlla questo settore a fine stagione vince la sua livrea esclusiva e diamanti.", "赛季结束时占领该区域的阵营将获得专属涂装和钻石。", "Сторона, удерживающая этот сектор в конце сезона, получает его эксклюзивное покрытие и алмазы.", "المعسكر المسيطر على هذا القطاع في نهاية الموسم يربح طلاءه الحصري والماس.", "جناحی که این منطقه را در پایان فصل در دست دارد پوشش ویژه آن و الماس می‌برد.", "シーズン終了時にこのセクターを支配する陣営が限定ラッピングとダイヤを獲得。", "시즌 종료 시 이 구역을 지킨 진영이 전용 래핑과 다이아몬드를 얻습니다.", "O lado que controlar este setor no fim da temporada ganha seu revestimento exclusivo e diamantes.", "Die Seite, die diesen Sektor am Saisonende hält, gewinnt dessen exklusive Folierung und Diamanten.", "Sezon sonunda bu bölgeyi elinde tutan taraf özel kaplamasını ve elmas kazanır.", "Pihak yang menguasai sektor ini di akhir musim memenangkan pembungkus eksklusif dan berlian.", "सीज़न के अंत में इस क्षेत्र पर क़ाबिज़ पक्ष इसका ख़ास रैप और हीरे जीतता है।"],
    secSoon: ["Les combats dans ce secteur ouvrent bientôt.", "Battles in this sector open soon.", "Los combates en este sector abren pronto.", "Le battaglie in questo settore apriranno presto.", "该区域的战斗即将开放。", "Бои в этом секторе скоро откроются.", "المعارك في هذا القطاع تُفتح قريبًا.", "نبردها در این منطقه به‌زودی آغاز می‌شود.", "このセクターでの戦闘はまもなく開始。", "이 구역의 전투가 곧 열립니다.", "As batalhas neste setor abrem em breve.", "Kämpfe in diesem Sektor starten bald.", "Bu bölgedeki savaşlar yakında açılıyor.", "Pertempuran di sektor ini segera dibuka.", "इस क्षेत्र में लड़ाइयाँ जल्द शुरू होंगी।"],
    hz_desert: ["Tempête de sable : vision et radar réduits pendant 15 secondes.", "Sandstorm: vision and radar reduced for 15 seconds.", "Tormenta de arena: visión y radar reducidos durante 15 segundos.", "Tempesta di sabbia: visuale e radar ridotti per 15 secondi.", "沙尘暴：视野和雷达降低15秒。", "Песчаная буря: обзор и радар снижены на 15 секунд.", "عاصفة رملية: تقل الرؤية والرادار لمدة 15 ثانية.", "طوفان شن: دید و رادار به مدت ۱۵ ثانیه کم می‌شود.", "砂嵐：15秒間、視界とレーダーが低下。", "모래 폭풍: 15초 동안 시야와 레이더가 줄어듭니다.", "Tempestade de areia: visão e radar reduzidos por 15 segundos.", "Sandsturm: Sicht und Radar 15 Sekunden lang eingeschränkt.", "Kum fırtınası: görüş ve radar 15 saniye azalır.", "Badai pasir: penglihatan dan radar berkurang selama 15 detik.", "रेत का तूफ़ान: 15 सेकंड तक दृश्यता और रडार कम।"],
    tip_desert: ["Cache-toi dans la tempête pour surprendre l'ennemi à sa sortie.", "Hide inside the storm to surprise your enemy as it clears.", "Escóndete en la tormenta para sorprender al enemigo cuando pase.", "Nasconditi nella tempesta per sorprendere il nemico quando finisce.", "躲进沙暴中，在它散去时突袭敌人。", "Спрячься в буре и атакуй врага, когда она уйдёт.", "اختبئ داخل العاصفة لتفاجئ العدو عند انقشاعها.", "در طوفان پنهان شو تا هنگام پایان آن دشمن را غافلگیر کنی.", "砂嵐に隠れて、晴れた瞬間に敵を奇襲。", "폭풍 속에 숨었다가 걷힐 때 적을 기습하세요.", "Esconda-se na tempestade para surpreender o inimigo quando ela passar.", "Versteck dich im Sturm und überrasche den Gegner, wenn er abzieht.", "Fırtınada saklan, dağılırken düşmanı şaşırt.", "Bersembunyilah di dalam badai untuk mengejutkan musuh saat badai reda.", "तूफ़ान में छिपें और उसके हटते ही दुश्मन को चौंकाएँ।"],

    tip_arctic: ["Vise un peu contre le vent et garde de l'élan pour rester stable.", "Aim slightly into the wind and keep momentum to stay steady.", "Apunta un poco contra el viento y mantén el impulso para estar estable.", "Mira un po' controvento e mantieni lo slancio per restare stabile.", "瞄准时略微逆风，并保持速度以稳住机身。", "Целься чуть против ветра и не теряй скорость, чтобы держаться ровно.", "صوّب قليلًا عكس الريح وحافظ على اندفاعك لتبقى ثابتًا.", "کمی خلاف باد نشانه بگیر و سرعتت را حفظ کن تا پایدار بمانی.", "少し風上を狙い、勢いを保って安定させよう。", "바람 반대쪽으로 살짝 조준하고 속도를 유지해 안정을 지키세요.", "Mire um pouco contra o vento e mantenha o impulso para ficar estável.", "Ziele leicht gegen den Wind und halte Schwung, um stabil zu bleiben.", "Biraz rüzgâra karşı nişan al ve dengede kalmak için hızını koru.", "Bidik sedikit melawan angin dan jaga laju agar tetap stabil.", "थोड़ा हवा के विपरीत निशाना लगाएँ और स्थिर रहने के लिए रफ़्तार बनाए रखें।"],

    notifNote: ['Activez les notifications pour être prévenu quand vos 3 vies sont rechargées.', 'Turn on notifications to be told when your 3 lives are refilled.', 'Activa las notificaciones para saber cuándo se recargan tus 3 vidas.', 'Attiva le notifiche per sapere quando le tue 3 vite sono ricaricate.', '开启通知，3 条生命恢复满时提醒你。', 'Включите уведомления, чтобы узнать, когда все 3 жизни восстановятся.', "فعّل الإشعارات لتعرف متى تعود أرواحك الثلاث.", "اعلان‌ها را روشن کنید تا وقتی ۳ جانتان پر شد باخبر شوید.", "ライフ3つが回復したときに通知を受け取るには、通知をオンにしてください。", "생명 3개가 다시 채워지면 알림을 받으려면 알림을 켜세요.", "Ative as notificações para saber quando as suas 3 vidas forem recarregadas.", "Aktiviere Benachrichtigungen, um zu erfahren, wann deine 3 Leben wieder aufgefüllt sind.", "3 canın dolduğunda haber almak için bildirimleri aç.", "Aktifkan notifikasi agar tahu saat 3 nyawamu terisi kembali.", "अपनी 3 ज़िंदगियाँ भरने पर सूचना पाने के लिए नोटिफ़िकेशन चालू करें।"],
    notifBlocked: ['Notifications refusées. Activez l\'interrupteur pour les autoriser ; si Android ne le propose plus, autorisez-les dans les réglages du téléphone (Applications › Drone Strike Field).', 'Notifications refused. Turn the switch on to allow them; if Android no longer asks, allow them in your phone settings (Apps › Drone Strike Field).', 'Notificaciones rechazadas. Activa el interruptor para permitirlas; si Android ya no lo pregunta, permítelas en los ajustes del teléfono (Aplicaciones › Drone Strike Field).', 'Notifiche rifiutate. Attiva l\'interruttore per consentirle; se Android non lo chiede più, consentile nelle impostazioni del telefono (App › Drone Strike Field).', '通知已被拒绝。打开开关即可授权；如果 Android 不再询问，请在手机设置（应用 › Drone Strike Field）中允许。', 'Уведомления отклонены. Включите переключатель, чтобы разрешить их; если Android больше не спрашивает, разрешите их в настройках телефона (Приложения › Drone Strike Field).', "تم رفض الإشعارات. فعّل المفتاح للسماح بها؛ وإذا لم يعد Android يسأل، اسمح بها من إعدادات الهاتف (التطبيقات › Drone Strike Field).", "اعلان‌ها رد شد. کلید را روشن کنید تا اجازه دهید؛ اگر Android دیگر نپرسید، از تنظیمات گوشی اجازه دهید (برنامه‌ها › Drone Strike Field).", "通知が拒否されました。スイッチをオンにして許可してください。Androidが再度確認しない場合は、端末の設定（アプリ › Drone Strike Field）で許可してください。", "알림이 거부되었습니다. 스위치를 켜서 허용하세요. Android가 더 이상 묻지 않으면 휴대폰 설정(앱 › Drone Strike Field)에서 허용하세요.", "Notificações recusadas. Ative o interruptor para permiti-las; se o Android já não perguntar, permita-as nas definições do telemóvel (Apps › Drone Strike Field).", "Benachrichtigungen abgelehnt. Schalte den Schalter ein, um sie zu erlauben; fragt Android nicht mehr, erlaube sie in den Handy-Einstellungen (Apps › Drone Strike Field).", "Bildirimler reddedildi. İzin vermek için anahtarı aç; Android artık sormuyorsa telefon ayarlarından izin ver (Uygulamalar › Drone Strike Field).", "Notifikasi ditolak. Nyalakan sakelar untuk mengizinkannya; jika Android tidak lagi bertanya, izinkan di pengaturan ponsel (Aplikasi › Drone Strike Field).", "नोटिफ़िकेशन अस्वीकार किए गए। अनुमति देने के लिए स्विच चालू करें; अगर Android अब नहीं पूछता, तो फ़ोन की सेटिंग्स में अनुमति दें (ऐप्स › Drone Strike Field)।"],

    desc_eclair: ['Très rapide, esquive plus fréquente, mais fragile (75 points de vie).', 'Very fast, dodges more often, but fragile (75 health).', 'Muy rápido, esquiva más a menudo, pero frágil (75 puntos de vida).', 'Molto veloce, schiva più spesso, ma fragile (75 punti vita).', '速度极快，闪避更频繁，但较脆弱（75 生命值）。', 'Очень быстрый, чаще уклоняется, но хрупкий (75 очков здоровья).', "سريعة جدًا وتراوغ أكثر، لكنها هشة (75 نقطة حياة).", "بسیار سریع، بیشتر جاخالی می‌دهد، اما شکننده است (۷۵ جان).", "非常に速く回避も多いが、もろい（HP75）。", "매우 빠르고 자주 회피하지만 약함(체력 75).", "Muito rápido, esquiva mais vezes, mas frágil (75 de vida).", "Sehr schnell, weicht öfter aus, aber zerbrechlich (75 Leben).", "Çok hızlı, daha sık kaçar ama kırılgan (75 can).", "Sangat cepat, lebih sering menghindar, tetapi rapuh (75 nyawa).", "बहुत तेज़, ज़्यादा बार बचता है, पर नाज़ुक (75 जीवन)।"],
    desc_blinde: ['Résistant (160 points de vie), tirs lourds à double dégâts, mais lent.', 'Tough (160 health), heavy shots with double damage, but slow.', 'Resistente (160 puntos de vida), disparos pesados con daño doble, pero lento.', 'Resistente (160 punti vita), colpi pesanti a danno doppio, ma lento.', '坚固（160 生命值），重型射击造成双倍伤害，但速度慢。', 'Прочный (160 очков здоровья), тяжёлые выстрелы с двойным уроном, но медленный.', "متينة (160 نقطة حياة)، طلقات ثقيلة بضرر مضاعف، لكنها بطيئة.", "مقاوم (۱۶۰ جان)، شلیک سنگین با آسیب دوبرابر، اما کند.", "頑丈（HP160）、2倍ダメージの重い射撃だが遅い。", "튼튼함(체력 160), 2배 피해의 강한 사격이지만 느림.", "Resistente (160 de vida), tiros pesados com dano duplo, mas lento.", "Robust (160 Leben), schwere Schüsse mit doppeltem Schaden, aber langsam.", "Dayanıklı (160 can), iki kat hasarlı ağır atışlar ama yavaş.", "Tangguh (160 nyawa), tembakan berat dengan kerusakan ganda, tetapi lambat.", "मज़बूत (160 जीवन), दोगुने नुकसान वाले भारी शॉट, पर धीमा।"],
    desc_assaut: ['Cadence de tir élevée, blindage léger (90 points de vie).', 'High fire rate, light armor (90 health).', 'Cadencia de disparo alta, blindaje ligero (90 puntos de vida).', 'Cadenza di fuoco elevata, corazza leggera (90 punti vita).', '射速高，装甲轻（90 生命值）。', 'Высокая скорострельность, лёгкая броня (90 очков здоровья).', "معدل إطلاق مرتفع، درع خفيف (90 نقطة حياة).", "نرخ شلیک بالا، زره سبک (۹۰ جان).", "高い連射速度、軽装甲（HP90）。", "높은 연사 속도, 가벼운 장갑(체력 90).", "Cadência elevada, blindagem leve (90 de vida).", "Hohe Feuerrate, leichte Panzerung (90 Leben).", "Yüksek atış hızı, hafif zırh (90 can).", "Laju tembak tinggi, lapisan baja ringan (90 nyawa).", "ऊँची फ़ायर दर, हल्का कवच (90 जीवन)।"],
